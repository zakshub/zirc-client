name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build reproducible binary archive
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o dist/zirc ./cmd/zirc
          cp README.md SECURITY.md PRIVACY.md THREAT_MODEL.md LICENSE dist/
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner -cf - -C dist . | gzip -n > "zirc-$VERSION-linux-${{ matrix.arch }}.tar.gz"
          sha256sum "zirc-$VERSION-linux-${{ matrix.arch }}.tar.gz" > "zirc-$VERSION-linux-${{ matrix.arch }}.tar.gz.sha256"
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksum with keyless Sigstore
        run: cosign sign-blob --yes --bundle "zirc-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz.sigstore.json" "zirc-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            zirc-*.tar.gz
            zirc-*.sha256
            zirc-*.sigstore.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes
