name: Go CI

on:
  push:
    branches: [main, desktop-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install Fyne Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev
      - name: Download Go modules
        run: go mod tidy
      - name: Format Go sources
        run: gofmt -w cmd internal
      - name: Unit and fuzz seed tests
        run: go test -race -tags ci ./...
      - name: Short IRC parser fuzz campaigns
        run: |
          go test ./internal/irc -run=^$ -fuzz=FuzzParseLine -fuzztime=5s
          go test ./internal/irc -run=^$ -fuzz=FuzzFormatValidate -fuzztime=5s
      - name: Static analysis
        run: go vet -tags ci ./...
      - name: Linux terminal build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/zirc ./cmd/zirc
      - name: Linux desktop build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/zirc-desktop ./cmd/zirc-desktop
