name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Format Go sources
        run: gofmt -w cmd internal
      - name: Unit and fuzz seed tests
        run: go test -race ./...
      - name: Short IRC parser fuzz campaigns
        run: |
          go test ./internal/irc -run=^$ -fuzz=FuzzParseLine -fuzztime=5s
          go test ./internal/irc -run=^$ -fuzz=FuzzFormatValidate -fuzztime=5s
      - name: Static analysis
        run: go vet ./...
      - name: Linux build
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/zirc ./cmd/zirc
