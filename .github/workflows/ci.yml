name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Check Go formatting
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            printf 'Go files need formatting:\n%s\n' "$files"
            exit 1
          fi
      - name: Unit and fuzz seed tests
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Linux build
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/zirc ./cmd/zirc
